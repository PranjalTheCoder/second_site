backend:
  name: github
  repo: PranjalTheCoder/second_site
  branch: main
  base_url: https://second-site-cms-auth.pranjaltamrakar0794.workers.dev
  open_authoring: true

publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: docs
    label: Documentation
    folder: content/docs
    create: true
    slug: "{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Category
        name: category
        widget: select
        options:
          - "Getting Started"
          - "Guides"
          - "Reference"
          - "Documentation"
        default: "Documentation"
        hint: "Controls which section of the sidebar this page appears under."

      - label: Order
        name: order
        widget: number
        required: false
        hint: "Lower numbers appear first within the category. Leave blank to sort last."

      - label: Description
        name: description
        widget: string
        required: false

      - label: Body
        name: body
        widget: markdown
        editor_components: ["image", "code-block", "mention"]
        hint: "Use a ```mermaid code block to add a diagram, and the Mention toolbar button to reference a team member by their GitHub handle."
