backend:
  name: github
  repo: PranjalTheCoder/second_site
  branch: main

publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: docs
    label: Documentation
    folder: content/docs
    create: true
    slug: "{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: string
        required: false

      - label: Body
        name: body
        widget: markdown
